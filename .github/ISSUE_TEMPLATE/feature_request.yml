name: Feature request
description: Suggest a new geometry, result, workflow or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem you want to solve, not only the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference or validation source
      description: For a new geometry or result, a closed-form formula, paper, textbook or other solver it could be validated against.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds or approaches you have tried.
    validations:
      required: false
